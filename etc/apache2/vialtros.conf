<VirtualHost *:80>
    ServerName vialtros.ds1.eleueleo.com
    ServerAlias www.vialtros.ds1.eleueleo.com
    
    # Log files
    ErrorLog ${APACHE_LOG_DIR}/vialtros-error.log
    CustomLog ${APACHE_LOG_DIR}/vialtros-access.log combined
    
    # Configuración de Proxy para Django Backend (Gunicorn)
    ProxyPreserveHost On
    
    # API endpoints
    ProxyPass /api http://127.0.0.1:8000/api
    ProxyPassReverse /api http://127.0.0.1:8000/api
    
    # Admin panel
    ProxyPass /admin http://127.0.0.1:8000/admin
    ProxyPassReverse /admin http://127.0.0.1:8000/admin
    
    # Auth endpoints
    ProxyPass /auth http://127.0.0.1:8000/auth
    ProxyPassReverse /auth http://127.0.0.1:8000/auth
    
    # WebSocket para tracking en tiempo real
    # Upgrade explicito via RewriteRule (requiere mod_proxy_wstunnel + mod_rewrite)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/ws/(.*) ws://127.0.0.1:8000/ws/$1 [P,L]

    ProxyPass /ws ws://127.0.0.1:8000/ws
    ProxyPassReverse /ws ws://127.0.0.1:8000/ws
    
    # Configuración del proxy
    ProxyTimeout 300
    ProxyConnectTimeout 60
    ProxyReceiveBufferSize 4096
    
    # React Frontend - Servir archivos estáticos
    DocumentRoot /var/www/ds1/Vialtros/frontend/build
    
    <Directory /var/www/ds1/Vialtros/frontend/build>
        Options -MultiViews
        # React Router: redirigir todas las rutas a index.html
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.html [QSA,L]
        Require all granted
        AddType application/javascript .js
        AddType text/css .css
    </Directory>
    
    # Servir archivos estáticos de Django (/admin y /rest_framework)
    Alias /static/admin /var/www/ds1/Vialtros/api/staticfiles/admin
    <Directory /var/www/ds1/Vialtros/api/staticfiles/admin>
        Require all granted
    </Directory>
    
    Alias /static/rest_framework /var/www/ds1/Vialtros/api/staticfiles/rest_framework
    <Directory /var/www/ds1/Vialtros/api/staticfiles/rest_framework>
        Require all granted
    </Directory>
    
    # Headers de seguridad
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    
    # CORS headers (adicional, aunque Django también los maneja)
    Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
    Header always set Access-Control-Allow-Headers "Content-Type, Authorization"
    
    # Compresión
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json
    </IfModule>
    
    # Caché para archivos estáticos
    <FilesMatch "\.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf)$">
        Header set Cache-Control "max-age=31536000, public"
    </FilesMatch>
    
    # HTML sin caché (para que siempre carga la versión más reciente)
    <FilesMatch "\.html$">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
    </FilesMatch>
</VirtualHost>
