name: Deploy to Apache (Manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Python dependencies
      run: |
        cd backend
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Build frontend
      run: |
        cd frontend
        npm run build

    - name: Prepare backend files
      run: |
        cd backend
        mkdir -p /tmp/vialtros/api
        cp -r . /tmp/vialtros/api/
        cd /tmp/vialtros/api
        python manage.py collectstatic --noinput
      env:
        DB_ENGINE: ${{ secrets.DB_ENGINE }}
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_PORT: ${{ secrets.DB_PORT }}
        DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        DJANGO_DEBUG: 'False'
        DJANGO_ALLOWED_HOSTS: ${{ secrets.DJANGO_ALLOWED_HOSTS }}

    - name: Deploy via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_SSH_PORT }}
        script: |

          APP_DIR="/var/www/ds1/Vialtros"

          echo "Starting deployment..."

          mkdir -p $APP_DIR

          cd $APP_DIR || exit 1

          # Clonar repo si no existe
          if [ ! -d ".git" ]; then
            echo "Cloning repository..."
            git clone https://github.com/Axwyk/Vialtros .
          fi

          echo "Pulling latest changes..."
          git reset --hard
          git pull origin master

          echo "Checking frontend structure..."
          ls -la frontend

          # FRONTEND
          echo "Installing frontend dependencies..."
          cd frontend || exit 1

          npm ci
          npm run build

          # Verificar build
          if [ ! -d "build" ]; then
            echo "Frontend build failed!"
            exit 1
          fi

          # BACKEND
          echo "Installing backend dependencies..."
          cd ../api || exit 1

          source venv/bin/activate

          pip install -r requirements.txt

          echo "Running migrations..."
          python manage.py migrate

          echo "Collecting static files..."
          python manage.py collectstatic --noinput

          echo "Restarting services..."
          sudo systemctl restart vialtros-django
          sudo systemctl restart apache2

          echo "Deployment completed!"