name: Deploy Frontend - Vialtros

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        working-directory: frontend
        run: npm install

      - name: Build del proyecto
        working-directory: frontend
        env:
          CI: false
          GENERATE_SOURCEMAP: false
        run: npm run build

      - name: Limpiar carpeta frontend
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            mkdir -p /var/www/ds1/Vialtros/frontend
            rm -rf /var/www/ds1/Vialtros/frontend/*

      - name: Desplegar frontend al VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "frontend/build/*"
          target: "/var/www/ds1/Vialtros/frontend"
          strip_components: 2
          rm: false
